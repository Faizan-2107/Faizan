const Ctx=createContext();

function useReducedMotion(){
const[r,setR]=useState(false);

function useReveal(delay=0){
const[vis,setVis]=useState(false);
const ref=useRef(null);
const rm=useReducedMotion();
useEffect(()=>{
const el=ref.current;if(!el)return;
const obs=new IntersectionObserver(([e])=>{
if(e.isIntersecting){
if(rm){setVis(true);obs.unobserve(el);return}
requestAnimationFrame(()=>requestAnimationFrame(()=>setVis(true)));
obs.unobserve(el);
}
},{threshold:0.1,rootMargin:'0px 0px -30px 0px'});
obs.observe(el);return()=>obs.disconnect();
},[delay,rm]);
return{ref,vis,style:{opacity:vis?1:0,transform:vis?'translateY(0)':'translateY(28px)',transition:rm?'none':`opacity 480ms ease ${delay}ms, transform 480ms ease ${delay}ms`}};
}

function useCountUp(target,active,dur=1400,dec=0){
const[val,setVal]=useState(0);const done=useRef(false);const rm=useReducedMotion();
useEffect(()=>{
if(!active||done.current)return;done.current=true;
if(rm){setVal(target);return}

function tick(now){const p=Math.min((now-t0)/dur,1);const e=1-Math.pow(1-p,3);setVal(dec>0?parseFloat((e*target).toFixed(dec)):Math.round(e*target));if(p<1)requestAnimationFrame(tick)}

},[active,target,dur,dec,rm]);return val;
}

function useActiveSection(ids){
const[active,setActive]=useState('');
useEffect(()=>{
const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)setActive(e.target.id)})},{threshold:0.2,rootMargin:'-80px 0px -40% 0px'});

}

function Reveal({children,delay=0,className=''}){
const{ref,vis,style}=useReveal(delay);
return(<div ref={ref} className={className} style={style}>{children}</div>);
}

function CyclingText({words}){

function TiltCard({children,className=''}){
